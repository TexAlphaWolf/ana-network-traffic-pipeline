apiVersion: 1
datasources:
  - name: ClickHouse
    uid: flowpipe-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      defaultDatabase: flowpipe
      username: grafana
    secureJsonData:
      password: ${GRAFANA_CLICKHOUSE_PASSWORD}
